name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Error: Releases must be created from main branch, got $REF"
          exit 1

      - name: Validate CODEOWNER
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ ! -f .github/CODEOWNERS ]; then
            echo "Error: .github/CODEOWNERS file not found"
            exit 1
          fi
          owners=$(grep -v '^\s*#' .github/CODEOWNERS | grep -oE '@[^[:space:]]+' | sed 's/^@//' | grep -v '/' | sort -u)
          authorized=false
          for owner in $owners; do
            if [ "$owner" = "$ACTOR" ]; then
              authorized=true
              break
            fi
          done
          if [ "$authorized" != "true" ]; then
            echo "Error: $ACTOR is not a CODEOWNER. Only CODEOWNERS can create releases."
            exit 1
          fi

      - name: Determine latest tag
        id: latest
        run: |
          tag=$(git tag -l 'v*.*.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$tag" ]; then
            tag="v0.0.0"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next
        env:
          CURRENT_TAG: ${{ steps.latest.outputs.tag }}
          BUMP: ${{ inputs.bump }}
        run: |
          current="${CURRENT_TAG#v}"
          IFS='.' read -r major minor patch <<< "$current"
          if [ "$major" -eq 0 ] && [ "$minor" -eq 0 ] && [ "$patch" -eq 0 ]; then
            # No prior release — first release is always v1.0.0
            next="v1.0.0"
          elif [ "$major" -eq 0 ]; then
            echo "Error: unexpected pre-v1 tag $CURRENT_TAG exists. First release must be v1.0.0."
            exit 1
          elif [ "$BUMP" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
            next="v${major}.${minor}.${patch}"
          elif [ "$BUMP" = "patch" ]; then
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          else
            echo "Error: unknown bump type: $BUMP"
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if [ -n "$(git tag -l "$VERSION")" ]; then
            echo "Error: tag $VERSION already exists"
            exit 1
          fi
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes
